trigger:
  branches:
    include:
      - dev
  paths:
    exclude:
      - '**/*.md'
      - docs/**

pr:
  branches:
    include:
      - dev

variables:
  azureServiceConnection: sc-fops-dev-wif
  registryName: acrfopsnonproddrizlaa
  registryLoginServer: acrfopsnonproddrizlaa.azurecr.io
  imageRepository: fops-market-pulse
  resourceGroup: rg-fops-dev
  containerAppName: ca-fops-market-pulse-dev
  nodeVersion: 22.x
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Tests
        displayName: Install and test
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000
            displayName: Install dependencies

          - script: npm test
            displayName: Run unit tests

  - stage: Build
    displayName: Build and publish image
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildImage
        displayName: Build MarketPulse image
        timeoutInMinutes: 60
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Build and push image
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az acr login --name "$(registryName)"
                docker build \
                  --file Dockerfile \
                  --tag "$(registryLoginServer)/$(imageRepository):$(Build.BuildId)" \
                  --tag "$(registryLoginServer)/$(imageRepository):dev" \
                  .
                docker push "$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"
                docker push "$(registryLoginServer)/$(imageRepository):dev"

  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeployMarketPulse
        displayName: Deploy MarketPulse
        environment: fops-dev
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: AzureCLI@2
                  displayName: Update Container App
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(registryLoginServer)/$(imageRepository):$(Build.BuildId)" \
                        --output none

                - task: AzureCLI@2
                  displayName: Verify DEV readiness
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      FQDN="$(az containerapp show \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --query properties.configuration.ingress.fqdn \
                        --output tsv)"

                      for attempt in $(seq 1 30); do
                        BODY="$(curl --silent --show-error --max-time 20 "https://${FQDN}/readyz" || true)"
                        echo "Readiness attempt ${attempt}: ${BODY}"
                        if [[ "${BODY}" == *'"db":"up"'* ]]; then
                          echo "MarketPulse is ready at https://${FQDN}"
                          exit 0
                        fi
                        sleep 10
                      done

                      echo "##vso[task.logissue type=error]MarketPulse did not become ready within five minutes."
                      az containerapp logs show \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --type system \
                        --tail 50 || true
                      exit 1
